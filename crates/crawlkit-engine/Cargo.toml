[package]
name = "crawlkit-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/crawlkit-engine"

[lints]
workspace = true

[[bench]]
name = "crawlkit_benchmarks"
harness = false

[features]
default = ["full"]
full = ["reqwest", "rusqlite", "tokio", "tokio-stream", "tracing", "dashmap", "parking_lot", "uuid", "rayon", "wasmtime", "aes-gcm", "dirs", "quick-xml", "csv", "lru", "sha2", "futures", "toml", "async-trait", "urlencoding", "getrandom", "bytes", "libloading", "sqlx", "redis"]
wasm = []
postgres = ["sqlx", "tokio"]

[dependencies]
# Always available
serde.workspace = true
serde_json.workspace = true
scraper.workspace = true
ego-tree.workspace = true
url.workspace = true
regex = "1"
chrono.workspace = true
thiserror.workspace = true

# Full-mode only
tokio = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
uuid = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
lru = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
toml = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
urlencoding = { version = "2.1", optional = true }
aes-gcm = { version = "0.10", optional = true }
getrandom = { version = "0.2", optional = true }
dirs = { version = "5.0", optional = true }
wasmtime = { workspace = true, optional = true }
quick-xml = { version = "0.41", optional = true }
rayon = { version = "1", optional = true }
libloading = { version = "0.8", optional = true }
redis = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
criterion.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }
proptest = "1"
