# cargo-deny configuration for crawlkit
# Enforces supply chain security: license compliance, vulnerability auditing, advisory database

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
    # fxhash (transitive via wasmtime): unmaintained upstream; tracked for a
    # wasmtime release that swaps to rustc-hash.
    { id = "RUSTSEC-2025-0057" },
    # number_prefix (transitive via indicatif): unmaintained; cosmetic
    # progress-bar dep, no security surface.
    { id = "RUSTSEC-2025-0119" },
    # paste (transitive via sqlx-macros): unmaintained; build-time only,
    # never linked into release binaries.
    { id = "RUSTSEC-2024-0436" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
highlight = "all"
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
