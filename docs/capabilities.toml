# crawlkit capability manifest
#
# This file is intentionally conservative. A capability is listed as stable only
# when the implementation is part of the supported product path and has tests.
# Numeric analyzer/test counts are generated by validation tooling, not hand
# copied into marketing text.

[project]
name = "crawlkit"
version = "5.0.0"
msrv = "1.94.0"
license = "Apache-2.0"

# Generated counts — DO NOT hand-edit.
# Regenerate with: cargo run -p crawlkit-engine --example manifest_drift_check -- --print
# CI fails on drift with the live analyzer registry (ROADMAP Phase 0.1).
[counts]
analyzer_count = 778
unique_analyzer_types = 778
# Distinct finding codes emitted by the default registry on a representative
# census page (see crawlkit_engine::manifest::generate). This is a lower bound
# on the total check inventory, not the full catalogue size.
finding_code_count = 137
profile_count = 4

[claims]
unsafe_scope = "Unsafe code is denied in ordinary core code; scoped unsafe FFI exists in ABI/plugin components."
performance_scope = "Performance is workload-dependent and must be reported with reproducible benchmark metadata."
standards_scope = "FAANG, HFT, ECN and defence are comparison categories, not certifications or compliance claims."

[commands]
names = [
  "crawl",
  "compare",
  "report",
  "backlinks",
  "crawl-map",
  "inspect",
  "plugin",
  "log-analyze",
  "trend",
  "gsc",
  "rank",
  "schedule",
]

[capabilities.crawler]
status = "stable"
evidence = [
  "crates/crawlkit-engine/src/crawl_engine",
  "crates/crawlkit-engine/tests/parallel_pipeline_tests.rs",
]

[capabilities.analyzers]
status = "stable"
evidence = [
  "crates/crawlkit-engine/src/analyzers",
  "crates/crawlkit-engine/src/analyzers/tests",
]
counting_note = "Report analyzer implementations and finding/check codes separately."

[capabilities.storage_sqlite]
status = "stable"
evidence = ["crates/crawlkit-engine/src/storage.rs"]

[capabilities.storage_postgres]
status = "conditional"
evidence = ["crates/crawlkit-engine/src/pg_storage.rs"]
requirements = ["postgres feature", "service-backed integration tests"]

[capabilities.wasm_plugins]
status = "stable-with-constraints"
evidence = [
  "crates/crawlkit-engine/src/plugin",
  "crates/crawlkit-engine/src/plugin_runtime.rs",
  "crates/crawlkit-engine/tests/wasm_abi_tests.rs",
]
constraints = ["signed or explicitly allow-unsigned verification policy", "fuel limit", "memory limit", "capability policy"]

[capabilities.native_plugins]
status = "experimental"
evidence = ["crates/crawlkit-engine/src/native_plugin.rs"]

[capabilities.redis_queue]
status = "experimental"
evidence = [
  "crates/crawlkit-engine/src/distributed_queue.rs",
  "crates/crawlkit-engine/src/queue_trait.rs",
]
requirements = ["Redis service", "distributed delivery semantics review"]

[capabilities.javascript_rendering]
status = "optional"
evidence = ["crates/crawlkit-engine/src/playwright.rs"]
requirements = ["Playwright/browser runtime"]

[capabilities.oidc]
status = "stable-with-configuration"
evidence = ["crates/crawlkit-api/src/oidc.rs"]

[capabilities.audit_trail]
status = "stable-with-configuration"
evidence = ["crates/crawlkit-engine/src/audit.rs"]

[capabilities.encryption_at_rest]
status = "optional"
evidence = ["crates/crawlkit-engine/src/encryption.rs"]

[capabilities.crux]
status = "optional"
evidence = ["crates/crawlkit-engine/src/crux.rs"]

[capabilities.openapi_api]
status = "stable"
evidence = ["crates/crawlkit-api"]

[capabilities.formal_verification]
status = "not-implemented"
evidence = []

[capabilities.hft_guarantees]
status = "not-applicable"
evidence = []
notes = "crawlkit is a network-bound batch crawler, not an ultra-low-latency trading system."

[capabilities.custom_extraction]
status = "stable-with-configuration"
evidence = [
  "crates/crawlkit-engine/src/extraction.rs",
  "crates/crawlkit-engine/src/crawl_engine/pipeline.rs",
]
requirements = ["extraction rules declared in crawlkit.toml with enabled = true"]

[capabilities.monitoring_mode]
status = "stable"
evidence = [
  "crates/crawlkit-engine/src/monitoring.rs",
  "crates/crawlkit/src/cli/crawl.rs",
]
notes = "Enabled per-crawl via the --monitor flag; alerts are severity-graded (info/warning/critical) against the previous crawl diff."

[capabilities.log_analysis]
status = "stable"
evidence = [
  "crates/crawlkit-engine/src/log_parser.rs",
  "crates/crawlkit-engine/src/log_analyzer.rs",
  "crates/crawlkit/src/cli/log_analyze.rs",
]
notes = "Supports Nginx combined, Apache combined, and JSON-structured log formats."

[capabilities.insights_engine]
status = "experimental"
evidence = ["crates/crawlkit-engine/src/insights.rs"]
notes = "Prioritized post-crawl insight ranking is implemented and tested in the engine library, but is not yet exposed through the CLI or API surface."

[capabilities.crawl_maps]
status = "stable"
evidence = [
  "crates/crawlkit-engine/src/crawl_map.rs",
  "crates/crawlkit/src/cli/crawl_map.rs",
]
notes = "Force-directed SVG visualization generated by the crawl-map command."

[capabilities.historical_trends]
status = "stable"
evidence = [
  "crates/crawlkit-engine/src/trends.rs",
  "crates/crawlkit/src/cli/trend.rs",
]
notes = "Time-series snapshot analysis with linear regression trend projection via the trend command."

[capabilities.gsc_integration]
status = "conditional"
evidence = [
  "crates/crawlkit-engine/src/gsc.rs",
  "crates/crawlkit/src/cli/gsc.rs",
]
requirements = ["Google Search Console API access", "access token (GSC_ACCESS_TOKEN or explicit)"]

[capabilities.llm_analysis]
status = "conditional"
evidence = [
  "crates/crawlkit-engine/src/llm_analyzer.rs",
  "crates/crawlkit/src/cli/mod.rs",
]
requirements = ["OpenAI- or Anthropic-compatible API endpoint", "API key via provider-specific environment variable"]
notes = "Bring-your-own-key post-crawl analysis enabled per-crawl via the --llm flag."

[capabilities.distributed_coordination]
status = "stable-with-configuration"
evidence = [
  "crates/crawlkit-engine/src/coordination.rs",
  "crates/crawlkit-engine/src/crawl_engine/mod.rs",
  "crates/crawlkit-engine/src/crawl_engine/pipeline.rs",
]
requirements = ["--distributed-mode with instance-id and instance-count"]
notes = "Hash- and range-based domain partitioning across crawl instances; queue sharing additionally depends on redis_queue."

[capabilities.multi_tenancy]
status = "stable-with-configuration"
evidence = [
  "crates/crawlkit-engine/src/enterprise.rs",
  "crates/crawlkit-api/src/handlers/tenants.rs",
  "crates/crawlkit-api/src/handlers/crawls.rs",
  "crates/crawlkit-api/src/persistence.rs",
]
requirements = ["API deployment with authentication and tenant provisioning"]

[capabilities.soc2_features]
status = "stable-with-configuration"
evidence = [
  "crates/crawlkit-engine/src/access_log.rs",
  "crates/crawlkit-engine/src/encryption.rs",
  "crates/crawlkit-engine/src/audit.rs",
  "crates/crawlkit-engine/src/lib.rs",
]
requirements = ["access logging enabled", "encryption key management", "data retention policy configured"]
notes = "Covers API access logging, encryption key rotation, audit trail, and data-retention purge policy. Operational compliance requires customer configuration."

[capabilities.opentelemetry]
status = "conditional"
evidence = [
  "crates/crawlkit-engine/src/observability/otel.rs",
  "crates/crawlkit-engine/src/observability.rs",
]
requirements = ["observability feature", "OTEL_ENDPOINT environment variable", "OTLP collector endpoint"]

[capabilities.wasi_preview2]
status = "experimental"
evidence = [
  "crates/crawlkit-engine/src/plugin/wasi_preview2.rs",
  "crates/crawlkit-engine/src/plugin/mod.rs",
]
requirements = ["wasi-preview2 feature"]
notes = "Component-model loading, analysis invocation, WASI CLI (bounded stdout/stderr capture, no fs/env/sockets) and HTTP outcalls (deny-by-default capability, SSRF-validated, 10s timeouts, 1 MiB response cap, no redirects) are implemented via wasmtime-wasi/wasmtime-wasi-http v47."
