[package]
name = "crawlkit-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "crawlkit_api"
path = "src/lib.rs"

[[bin]]
name = "crawlkit-api"
path = "src/main.rs"

[dependencies]
crawlkit-engine = { path = "../crawlkit-engine" }
tokio.workspace = true
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["full"] }
http = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
chrono.workspace = true
url.workspace = true
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["trace"] }
opentelemetry-stdout = { version = "0.32", features = ["trace"] }
opentelemetry-otlp = { version = "0.32", features = ["trace", "grpc-tonic"] }
dashmap.workspace = true
sha2.workspace = true
hmac = "0.12"
rand = "0.8"
prometheus-client = "0.22"
reqwest.workspace = true
jsonwebtoken = "9"
argon2 = "0.5"
parking_lot.workspace = true
urlencoding = "2.1"
thiserror.workspace = true
hex = "0.4"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "tracing", "rustls"] }
rusqlite = "0.32"
async-trait = "0.1"
sqlx = { workspace = true }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
salting.workspace = true
tokenkit.workspace = true
cryptkit.workspace = true
loop-retry = { workspace = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
