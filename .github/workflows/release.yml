name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  checks: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    # v5.0.0's workspace (unified types crate, larger analyzer/contract suites)
    # exceeded the former 15-minute cap on a cold cache: the serial full
    # workspace test run alone approached 15 min before clippy could start.
    # 45 minutes matches the build-matrix jobs and leaves headroom for a cold
    # compile of the whole workspace plus clippy --all-targets.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Run all tests
        env:
          CARGO_BUILD_JOBS: "1"
          RUST_TEST_THREADS: "1"
        run: cargo test --workspace -- --test-threads=1
      - name: Run clippy
        env:
          CARGO_BUILD_JOBS: "1"
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Security audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [preflight]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        env:
          OPENSSL_STATIC: "1"
          OPENSSL_NO_VENDOR: "1"
        run: cross build --release --target ${{ matrix.target }}

      # NOTE: tests intentionally NOT run here. The full suite is gated twice
      # elsewhere — CI on main (ubuntu, incl. service containers) and the
      # release preflight (cargo test --workspace). Running the suite again
      # per-platform triple-tests and caused Windows timeouts: wasm_abi_tests
      # triggers a second full wasm32 dependency compile (~20+ min on a
      # Windows runner). Matrix jobs build + package only.
      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../crawlkit-${{ github.ref_name }}-${{ matrix.target }}.tar.gz crawlkit
          cd ../../..
          test -s target/crawlkit-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../crawlkit-${{ github.ref_name }}-${{ matrix.target }}.zip crawlkit.exe
          cd ../../..
          test -s target/crawlkit-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Smoke test artifact
        shell: bash
        run: |
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -tzf target/crawlkit-${{ github.ref_name }}-${{ matrix.target }}.tar.gz | grep -q 'crawlkit$'
          else
            7z l target/crawlkit-${{ github.ref_name }}-${{ matrix.target }}.zip | grep -q 'crawlkit.exe'
          fi

      - name: Generate checksum
        shell: bash
        run: |
          cd target
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            sha256sum crawlkit-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > crawlkit-${{ github.ref_name }}-${{ matrix.target }}.sha256
          else
            sha256sum crawlkit-${{ github.ref_name }}-${{ matrix.target }}.zip > crawlkit-${{ github.ref_name }}-${{ matrix.target }}.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crawlkit-${{ matrix.target }}
          path: |
            target/crawlkit-${{ github.ref_name }}-${{ matrix.target }}.*
            !target/crawlkit-${{ github.ref_name }}-${{ matrix.target }}.d

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Aggregate checksums
        run: |
          cd artifacts
          # actions/download-artifact v8 nests each artifact under its own
          # directory, so verify every checksum against its archive in place
          # (entries are bare filenames relative to that directory) before
          # concatenating them into the single signed checksums.txt.
          find . -type f -name '*.sha256' -print0 | xargs -0 -r cat > checksums.txt
          test -s checksums.txt
          failed=0
          while IFS= read -r -d '' f; do
            (cd "$(dirname "$f")" && sha256sum -c "$(basename "$f")") || failed=1
          done < <(find . -type f -name '*.sha256' -print0)
          [ "$failed" -eq 0 ]
          # Verify the aggregate exactly as consumers will: flatten the
          # archives beside checksums.txt and check the bare filenames.
          mkdir -p flat
          find . -mindepth 2 -type f ! -name '*.sha256' -exec cp {} flat/ \;
          cp checksums.txt flat/
          (cd flat && sha256sum -c checksums.txt)
          echo "=== Release checksums ==="
          cat checksums.txt

      - name: Generate SBOM
        run: |
          mkdir -p sbom
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json
          find crates -name '*.cdx.json' -exec cp {} sbom/ \;

      - name: Add SBOM checksums
        shell: bash
        run: |
          cd artifacts
          # Bare-filename entries (not ../sbom/... paths): the release uploads
          # the .cdx.json assets flat next to checksums.txt, so consumers can
          # verify the whole manifest with sha256sum -c checksums.txt.
          (cd ../sbom && sha256sum ./*.cdx.json) >> checksums.txt
          sort -o checksums.txt checksums.txt
          # Refresh the flat staging dir and re-verify the full manifest
          # (archives + SBOM) exactly as consumers will.
          cp ../sbom/*.cdx.json flat/
          cp checksums.txt flat/
          (cd flat && sha256sum -c checksums.txt)

      - name: Sign checksums (single signature covers all artifacts + SBOM)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd artifacts
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor checksums.txt
          gpg --verify checksums.txt.asc checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/crawlkit-*
            artifacts/checksums.txt
            artifacts/checksums.txt.asc
            sbom/**
