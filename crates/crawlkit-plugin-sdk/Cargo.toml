[package]
name = "crawlkit-plugin-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SDK for building crawlkit WASM plugins"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/crawlkit-plugin-sdk"
readme.workspace = true
keywords = ["seo", "crawler", "plugin", "wasm", "sdk"]
categories = ["wasm", "web-programming"]

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
exit = "deny"
modulo_arithmetic = "warn"
redundant_clone = "warn"
unused_async = "warn"
if_not_else = "warn"

[features]
# WASI Preview 2 component-model support, used by the `wasi-*` examples.
# Requires wasmtime >= 47 with component-model support. The core WASM ABI
# (and this crate's library code) does not depend on wasmtime at all.
wasi = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
crawlkit-types = { path = "../crawlkit-types" }
serde.workspace = true
serde_json.workspace = true
# Optional: component-model host bindings for the `wasi-*` examples
# (wasmtime::component::Component / bindgen!).
wasmtime = { workspace = true, optional = true, features = ["component-model"] }
# Optional: WASI host implementations (wasi:cli, wasi:io, ...) for running
# components that import standard WASI interfaces.
wasmtime-wasi = { workspace = true, optional = true }

[dev-dependencies]
