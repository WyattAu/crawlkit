name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a7440e3bd8589 # stable

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc56dabe9d743a # v2
        with:
          prefix-key: "mutants"

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run mutation tests (analyzers only)
        run: |
          cargo mutants \
            --file 'crates/crawlkit-engine/src/analyzers/' \
            --timeout 120 \
            --jobs 4 \
            --in-place
        timeout-minutes: 90

      - name: Check catch rate
        run: |
          MISSED=$(grep -c "Missed" mutants.out/outcomes.txt 2>/dev/null || echo "0")
          CAUGHT=$(grep -c "Caught" mutants.out/outcomes.txt 2>/dev/null || echo "0")
          TOTAL=$((MISSED + CAUGHT))
          if [ "$TOTAL" -eq 0 ]; then
            echo "No mutants found"
            exit 0
          fi
          RATE=$((CAUGHT * 100 / TOTAL))
          echo "Mutation catch rate: ${RATE}% (${CAUGHT}/${TOTAL})"
          if [ "$RATE" -lt 70 ]; then
            echo "::warning::Mutation catch rate ${RATE}% is below 70% threshold"
            grep "Missed" mutants.out/outcomes.txt 2>/dev/null | head -20 || true
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-results
          path: mutants.out/
          retention-days: 7
