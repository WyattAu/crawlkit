# crawlkit capability manifest
#
# This file is intentionally conservative. A capability is listed as stable only
# when the implementation is part of the supported product path and has tests.
# Numeric analyzer/test counts are generated by validation tooling, not hand
# copied into marketing text.

[project]
name = "crawlkit"
version = "4.4.1"
msrv = "1.94.0"
license = "Apache-2.0"

[claims]
unsafe_scope = "Unsafe code is denied in ordinary core code; scoped unsafe FFI exists in ABI/plugin components."
performance_scope = "Performance is workload-dependent and must be reported with reproducible benchmark metadata."
standards_scope = "FAANG, HFT, ECN and defence are comparison categories, not certifications or compliance claims."

[commands]
names = [
  "crawl",
  "compare",
  "report",
  "backlinks",
  "crawl-map",
  "inspect",
  "plugin",
  "log-analyze",
  "trend",
  "gsc",
]

[capabilities.crawler]
status = "stable"
evidence = [
  "crates/crawlkit-engine/src/crawl_engine",
  "crates/crawlkit-engine/tests/parallel_pipeline_tests.rs",
]

[capabilities.analyzers]
status = "stable"
evidence = [
  "crates/crawlkit-engine/src/analyzers",
  "crates/crawlkit-engine/src/analyzers/tests",
]
counting_note = "Report analyzer implementations and finding/check codes separately."

[capabilities.storage_sqlite]
status = "stable"
evidence = ["crates/crawlkit-engine/src/storage.rs"]

[capabilities.storage_postgres]
status = "conditional"
evidence = ["crates/crawlkit-engine/src/pg_storage.rs"]
requirements = ["postgres feature", "service-backed integration tests"]

[capabilities.wasm_plugins]
status = "stable-with-constraints"
evidence = [
  "crates/crawlkit-engine/src/plugin",
  "crates/crawlkit-engine/src/plugin_runtime.rs",
  "crates/crawlkit-engine/tests/wasm_abi_tests.rs",
]
constraints = ["signed or explicitly allow-unsigned verification policy", "fuel limit", "memory limit", "capability policy"]

[capabilities.native_plugins]
status = "experimental"
evidence = ["crates/crawlkit-engine/src/native_plugin.rs"]

[capabilities.redis_queue]
status = "experimental"
evidence = [
  "crates/crawlkit-engine/src/distributed_queue.rs",
  "crates/crawlkit-engine/src/queue_trait.rs",
]
requirements = ["Redis service", "distributed delivery semantics review"]

[capabilities.javascript_rendering]
status = "optional"
evidence = ["crates/crawlkit-engine/src/playwright.rs"]
requirements = ["Playwright/browser runtime"]

[capabilities.oidc]
status = "stable-with-configuration"
evidence = ["crates/crawlkit-api/src/oidc.rs"]

[capabilities.audit_trail]
status = "stable-with-configuration"
evidence = ["crates/crawlkit-engine/src/audit.rs"]

[capabilities.encryption_at_rest]
status = "optional"
evidence = ["crates/crawlkit-engine/src/encryption.rs"]

[capabilities.crux]
status = "optional"
evidence = ["crates/crawlkit-engine/src/crux.rs"]

[capabilities.openapi_api]
status = "stable"
evidence = ["crates/crawlkit-api"]

[capabilities.formal_verification]
status = "not-implemented"
evidence = []

[capabilities.hft_guarantees]
status = "not-applicable"
evidence = []
notes = "crawlkit is a network-bound batch crawler, not an ultra-low-latency trading system."
