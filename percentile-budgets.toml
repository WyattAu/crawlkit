# Committed percentile budgets — estate standard §5 (P50/P99 within SLA).
#
# Enforced by the "Benchmark Regression Detection" workflow via
# `crawlkit-budget-check` (crates/crawlkit-budget-check), a thin wrapper
# over percentile-kit's report feature
# (https://github.com/WyattAu/percentile-kit). This is a second,
# percentile-explicit gate alongside the workflow's live main-vs-PR
# mean comparison: it re-checks the criterion output the run just wrote
# at the percentile level (P99 = nearest-rank over criterion's sampled
# data).
#
# FIRST-PASS VALUES, DELIBERATELY LOOSE: budgets are ~3x the means in
# docs/benchmarks/baseline/criterion.txt (recorded 2026-08-30 on local
# hardware; CI runners are slower and noisier), P99 budgets get a further
# 2x over the P50 budget, and max_regression_pct is 25%. They exist to
# catch catastrophic regressions without false reds, and are expected to
# TIGHTEN as CI accumulates real P50/P99 data.
#
# Schema (percentile-kit, deny_unknown_fields): `metric` names the bench
# directory under target/criterion; `p50`/`p99` budgets and
# `max_regression_pct` (allowed excess, %) are per-metric. Units are
# criterion's base unit (nanoseconds per iteration).

[[budget]]
metric = "html_parser/parse_small_page" # baseline ~149 us
p50 = 500_000.0
p99 = 1_000_000.0
max_regression_pct = 25.0

[[budget]]
metric = "html_parser/parse_5kb_page" # baseline ~625 us
p50 = 2_000_000.0
p99 = 4_000_000.0
max_regression_pct = 25.0

