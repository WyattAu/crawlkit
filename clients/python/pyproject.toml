[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawlkit-python"
version = "1.0.0"
description = "Python client for crawlkit REST API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
authors = [
    { name = "Wyatt Au", email = "wyatt@example.com" }
]
keywords = ["seo", "crawler", "api", "client"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/WyattAu/crawlkit"
Documentation = "https://github.com/WyattAu/crawlkit/tree/main/clients/python"
Repository = "https://github.com/WyattAu/crawlkit"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]
