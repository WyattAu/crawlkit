name: Feature matrix

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine-features:
    name: Engine feature matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full
            args: '--features full'
          - name: core
            args: '--no-default-features'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check crawlkit-engine (${{ matrix.name }})
        run: cargo check -p crawlkit-engine ${{ matrix.args }}
      - name: Check crawlkit CLI core target
        if: matrix.name == 'core'
        run: cargo check -p crawlkit --no-default-features
      - name: Check crawlkit CLI full target
        if: matrix.name == 'full'
        run: cargo check -p crawlkit --features full
      - name: Check crawlkit CLI queue-ops target (ADR-015 §3 surface)
        if: matrix.name == 'full'
        run: cargo check -p crawlkit --features queue-ops

  scanner-features:
    name: Scanner feature matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default (single-replica posture)
            args: ''
          - name: shared-budget (multi-replica posture)
            args: '--features shared-budget'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check crawlkit-scanner (${{ matrix.name }})
        run: cargo check -p crawlkit-scanner ${{ matrix.args }}
      - name: Test crawlkit-scanner (${{ matrix.name }})
        run: cargo test -p crawlkit-scanner ${{ matrix.args }} --lib
