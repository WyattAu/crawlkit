name: Feature matrix

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine-features:
    name: Engine feature matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full
            args: '--features full'
          - name: core
            args: '--no-default-features'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check crawlkit-engine (${{ matrix.name }})
        run: cargo check -p crawlkit-engine ${{ matrix.args }}
      - name: Check crawlkit CLI core target
        if: matrix.name == 'core'
        run: cargo check -p crawlkit --no-default-features
      - name: Check crawlkit CLI full target
        if: matrix.name == 'full'
        run: cargo check -p crawlkit --features full
