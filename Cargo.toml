[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Lints enforced at workspace level
unwrap_used = "warn"           # Prohibit unwrap() in production; fix incrementally
expect_used = "warn"           # Prohibit expect() in production; fix incrementally
panic = "warn"                 # Prohibit panic!() in production; use error propagation
exit = "deny"                  # Never call process::exit in library code
modulo_arithmetic = "warn"
redundant_clone = "warn"
unused_async = "warn"
if_not_else = "warn"


[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.85.0"
authors = ["Wyatt Au"]
license = "Apache-2.0"
description = "High-performance Rust web crawler and SEO analysis toolkit with 31 analyzers, WASM plugin system, and enterprise features"
repository = "https://github.com/WyattAu/crawlkit"
homepage = "https://github.com/WyattAu/crawlkit"
documentation = "https://docs.rs/crawlkit-engine"
readme = "README.md"
keywords = ["seo", "crawler", "web-crawler", "analysis", "rust"]
categories = ["command-line-utilities", "web-programming", "wasm"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
dashmap = "6"
parking_lot = "0.12"
wasmtime = "47"
scraper = "0.22"
ego-tree = "0.10"
csv = "1"
lru = "0.13"
sha2 = "0.10"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[workspace.metadata.fuzz]
targets = ["fuzz_parser"]
