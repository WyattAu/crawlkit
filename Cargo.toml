[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Critical lints (warn level -- do not block CI yet)
# These flag patterns that should be eliminated in production code
unwrap_used = "allow"          # Flag but do not block; fix incrementally
expect_used = "allow"          # Flag but do not block; fix incrementally
panic = "allow"                # Flag but do not block; fix incrementally
exit = "deny"                  # Never call process::exit in library code
modulo_arithmetic = "warn"


[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Wyatt Au"]
license = "Apache-2.0"
description = "A high-performance Rust-based site crawler for SEO analysis"
repository = "https://github.com/WyattAu/crawlkit"
keywords = ["seo", "crawler", "web-crawler", "analysis", "rust"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"
homepage = "https://github.com/WyattAu/crawlkit"
documentation = "https://github.com/WyattAu/crawlkit"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
dashmap = "6"
parking_lot = "0.12"
scraper = "0.22"
ego-tree = "0.10"
csv = "1"
lru = "0.12"
sha2 = "0.11"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
