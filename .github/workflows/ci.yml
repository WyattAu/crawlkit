name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  manifest-drift:
    name: Capability Manifest Drift (Phase 0.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Fail when docs/capabilities.toml counts disagree with the registry
        run: cargo run --quiet -p crawlkit-engine --example manifest_drift_check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Unit tests (fast feedback, incl. bin-only crates e.g. crawlkit-api)
        run: cargo test --workspace --bins --lib
      - name: Doc tests
        run: cargo test --doc --workspace

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: integration
      - name: Integration tests (excluding playwright)
        run: cargo test --workspace --test integration_tests --test backlink_integration_tests --test rum_integration_tests --test parallel_pipeline_tests --test property_tests --test wasm_abi_tests --test plugin_index_tests --test router_tests --test ssrf_boundary_tests --test storage_contract_tests --test queue_contract_tests --test analyzer_registry_contract_tests

  test-services:
    name: Service-backed Tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crawlkit
          POSTGRES_PASSWORD: crawlkit
          POSTGRES_DB: crawlkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawlkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: quay.io/minio/minio:latest
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        env:
          MINIO_ROOT_USER: crawlkit
          MINIO_ROOT_PASSWORD: crawlkit-secret
        cmd: server /data
    env:
      DATABASE_URL: postgres://crawlkit:crawlkit@localhost:5432/crawlkit_test
      REDIS_URL: redis://127.0.0.1:6379/
      WAREHOUSE_S3_ENDPOINT: http://127.0.0.1:9000
      WAREHOUSE_S3_ACCESS_KEY: crawlkit
      WAREHOUSE_S3_SECRET_KEY: crawlkit-secret
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: services
      # Previously-ignored tests that require live PostgreSQL/Redis: the
      # pg_storage suite, the distributed (Redis) queue suite, and the
      # API-plane Postgres state store.
      # NOTE: the pg_storage tests share one database and some assert on
      # global store state (e.g. get_latest_crawl_id), so they must run
      # serially — parallel threads race on the shared crawls table.
      - name: PostgreSQL-backed tests
        run: cargo test -p crawlkit-engine --features postgres --lib pg_storage -- --ignored --test-threads=1
      - name: PostgreSQL API state store test
        run: cargo test -p crawlkit-api --lib pg_tests -- --ignored --test-threads=1
      # Redis-backed suites live behind the `unstable` feature gate; run
      # them with it enabled (serially — suites share one Redis DB).
      - name: Redis distributed queue tests
        run: cargo test -p crawlkit-engine --features unstable --lib distributed_queue -- --ignored --test-threads=1
      - name: Redis politeness budget tests
        run: cargo test -p crawlkit-engine --features unstable --lib politeness -- --ignored --test-threads=1
      - name: Redis queue dead-letter operator tests
        run: cargo test -p crawlkit --features queue-ops --bin crawlkit queue -- --ignored --test-threads=1
      - name: Redis scanner worker tests (multi-replica posture)
        run: cargo test -p crawlkit-scanner --features shared-budget --lib worker -- --ignored --test-threads=1
      # Warehouse round-trip contract test: real Parquet export -> real S3
      # SigV4 upload against MinIO -> read back and byte-compare. Needs a
      # bucket; create it with the MinIO client bundled in the image.
      - name: Warehouse S3 round-trip contract test
        run: |
          docker exec "$(docker ps -qf name=minio)" sh -c '
            mc alias set local http://127.0.0.1:9000 crawlkit crawlkit-secret &&
            (mc stat local/crawlkit-test-exports >/dev/null 2>&1 || mc mb local/crawlkit-test-exports)'
          # The round-trip test self-skips unless WAREHOUSE_S3_* is set;
          # the job-level env points it at the MinIO service.
          cargo test -p crawlkit-engine --features warehouse \
            --test warehouse_roundtrip

  roadmap-controls:
    name: Roadmap and Security Controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      # The controls script compiles several Rust test binaries; without a
      # shared target cache this job alone exceeded the old 15-minute cap.
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: roadmap-controls
      - name: Verify roadmap, capabilities, unsafe inventory, and contracts
        env:
          CRAWLKIT_TEST_THREADS: '1'
        run: bash scripts/verify-release-controls.sh

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Advisory (non-blocking): cargo-deny is the enforcing advisory gate
      # (deny.toml carries the documented ignore list with rationale).
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, test-integration, security]
    timeout-minutes: 15
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo build --release --workspace

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: coverage
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Measure supported native targets separately. A workspace-wide
      # coverage invocation also discovers the wasm32 test target and can fail
      # during instrumentation before producing a trustworthy report.
      - name: Generate engine coverage report
        run: |
          cargo llvm-cov -p crawlkit-engine --lib --summary-only \
            -- --test-threads=1 2>&1 | tee engine-cov-summary.txt
          # Column 4 of the summary TOTAL row is region coverage.
          ENGINE_PCT=$(awk '/^TOTAL/ {sub(/%/,"",$4); print $4}' engine-cov-summary.txt)
          echo "Measured engine library region coverage: ${ENGINE_PCT}%"
          awk -v pct="$ENGINE_PCT" -v floor=70 'BEGIN { exit (pct < floor) ? 1 : 0 }' \
            || { echo "::error::engine coverage ${ENGINE_PCT}% is below the 70% floor"; exit 1; }
          cargo llvm-cov -p crawlkit-engine --lib --lcov --output-path engine-coverage.lcov
      # Binary entrypoints (src/main.rs) are process bootstrap, not product
      # logic; see docs/COVERAGE_CONTRACT.md. The ignore list is applied to
      # both the summary gate and the LCOV upload so they never diverge.
      - name: Generate API coverage report
        run: |
          cargo llvm-cov -p crawlkit-api --all-targets --summary-only \
            --ignore-filename-regex 'src/main\.rs' \
            -- --test-threads=1 2>&1 | tee api-cov-summary.txt
          # Column 4 of the summary TOTAL row is region coverage.
          API_PCT=$(awk '/^TOTAL/ {sub(/%/,"",$4); print $4}' api-cov-summary.txt)
          echo "Measured API all-target region coverage: ${API_PCT}%"
          awk -v pct="$API_PCT" -v floor=50 'BEGIN { exit (pct < floor) ? 1 : 0 }' \
            || { echo "::error::API coverage ${API_PCT}% is below the 50% floor"; exit 1; }
          cargo llvm-cov -p crawlkit-api --all-targets --lcov \
            --ignore-filename-regex 'src/main\.rs' --output-path api-coverage.lcov
          cat engine-coverage.lcov api-coverage.lcov > coverage.lcov
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          file: coverage.lcov
          flags: native-targets

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: msrv
      - run: cargo check --workspace

  semver:
    name: Semver Check
    runs-on: ubuntu-latest
    # 30 min (2026-09-16): the workspace's rustdoc-metadata build against
    # the last tag crosses 15 min on slow hosted-runner windows, and GitHub
    # reports the timeout as job-level `cancelled` with zero failed jobs —
    # four run-level cancellations on 2026-09-16 all died inside this job
    # (started → cancelled ≈ 15:45) while every other job was green.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: semver
      - uses: taiki-e/install-action@5f1c7d47567fbeb225672537fc0c8ea05af39882 # v2
        with:
          tool: cargo-semver-checks
      # Enforcing against the latest tag. Breaking API changes require a
      # major-version bump; this gate makes that contract real.
      # (--baseline-rev is the correct flag: --baseline is not a valid
      # argument and previously caused a misleading rustdoc-file error.)
      - name: cargo-semver-checks-lint
        run: |
          BASE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$BASE" ]; then
            echo "Semver baseline: $BASE"
            cargo semver-checks check-release --baseline-rev "$BASE"
          else
            echo "::error::No tags found; refusing to run without a semver baseline"
            exit 1
          fi

  fuzz:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: fuzz
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Run fuzz targets (smoke test)
        run: |
          if [ -d crates/crawlkit-engine/fuzz ]; then
            cd crates/crawlkit-engine
            for target in $(cargo fuzz list 2>/dev/null); do
              echo "Running fuzz target: $target"
              cargo fuzz run "$target" -- -max_total_time=30 || exit 1
            done
          else
            echo "No fuzz directory found (expected at crates/crawlkit-engine/fuzz), skipping fuzz tests"
          fi

  capacity-smoke:
    name: Capacity Smoke (1k gated crawl)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Restore capacity baseline
        id: baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: capacity-baseline
          # -v2 (2026-09-15): intentional re-seed after the issue-aggregate
          # memory fix (docs/capacity/2026-09-15-post-fix-10k/) — engine
          # throughput/RSS legitimately moved beyond the ±20% relative gate,
          # so the pre-fix baseline is stale by evidence, not drift.
          # -v3 (2026-09-16): re-seed to attach the machine-speed
          # calibration record (capacity_smoke `calibrate_ops_per_sec`) —
          # the relative gate now normalizes throughput thresholds by the
          # calibrated current/baseline speed ratio, so sustained
          # slow-runner windows (tracker Resets 3–4) no longer read as
          # engine regressions. Auto-arming: the first -v3 run records
          # ungated, the next one gates with calibration on both sides.
          key: capacity-baseline-smoke-1k-v3
      - name: Run capacity smoke (1k-page loopback crawl)
        env:
          # Absolute paths: cargo runs the test with CWD = crate root, and
          # relative paths would land outside the workspace the steps read.
          CAPACITY_RECORD_DIR: ${{ github.workspace }}/capacity-out
          CAPACITY_BASELINE_PATH: ${{ github.workspace }}/capacity-baseline/run_record.json
          # Auto-arming: enforce only once a committed CI baseline exists —
          # the first run records and passes absolutely; the next one gates.
          CAPACITY_ENFORCE: ${{ steps.baseline.outputs.cache-hit == 'true' && '1' || '0' }}
        run: cargo test -p crawlkit-engine --test capacity_smoke -- --ignored --nocapture
      - name: Seed baseline on first run (arms enforcement for the next)
        if: steps.baseline.outputs.cache-hit != 'true'
        run: mkdir -p capacity-baseline && cp capacity-out/run_record.json capacity-baseline/run_record.json
      - name: Upload run record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-run-record
          path: capacity-out/run_record.json
