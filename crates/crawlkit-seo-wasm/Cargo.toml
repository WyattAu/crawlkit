[package]
name = "crawlkit-seo-wasm"
version = "3.0.0"
license = "Apache-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
crawlkit-engine = { path = "../crawlkit-engine", default-features = false, features = ["wasm"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.22"
url = "2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
