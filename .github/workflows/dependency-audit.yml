name: Dependency Audit (Daily)

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Advisory (non-blocking): cargo-deny is the enforcing advisory gate
      # (deny.toml carries the documented ignore list with rationale).
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  pnpm-audit:
    name: PNPM Audit (Dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (gate)
        # GHSA-vfj7-8cjw-p6xm (braces, stack-exhaustion DoS) is held on
        # purpose: it reaches the dashboard only through the tailwindcss 3
        # dev toolchain, and no fixed braces release exists — 3.0.3 is the
        # newest. Held visibly, like the estate's pins_held entries, until
        # upstream ships a fix or the dashboard migrates to tailwind 4.
        run: |
          pnpm audit --json > audit.json
          UNHELD=$(jq --arg held 'GHSA-vfj7-8cjw-p6xm' \
            '[.advisories[] | select(.github_advisory_id != $held and (.severity == "high" or .severity == "critical"))] | length' \
            audit.json)
          echo "non-held high/critical advisories: $UNHELD"
          test "$UNHELD" -eq 0
