name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Unit tests (fast feedback, incl. bin-only crates e.g. crawlkit-api)
        run: cargo test --workspace --bins --lib
      - name: Doc tests
        run: cargo test --doc --workspace

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@42dc69e1aa15d091125809e98cf2ef0119e2e91ae # v2
        with:
          key: integration
      - name: Integration tests (excluding playwright)
        run: cargo test --workspace --test integration_tests --test backlink_integration_tests --test rum_integration_tests --test parallel_pipeline_tests --test property_tests --test wasm_abi_tests --test router_tests

  test-services:
    name: Service-backed Tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crawlkit
          POSTGRES_PASSWORD: crawlkit
          POSTGRES_DB: crawlkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawlkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://crawlkit:crawlkit@localhost:5432/crawlkit_test
      REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: services
      # Previously-ignored tests that require live PostgreSQL/Redis: the
      # pg_storage suite, the distributed (Redis) queue suite, and the
      # API-plane Postgres state store.
      - name: PostgreSQL-backed tests
        run: cargo test -p crawlkit-engine --features postgres --lib pg_storage -- --ignored --test-threads=4
      - name: PostgreSQL API state store test
        run: cargo test -p crawlkit-api --lib pg_tests -- --ignored --test-threads=1
      - name: Redis distributed queue tests
        run: cargo test -p crawlkit-engine --lib distributed_queue -- --ignored --test-threads=1

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Advisory (non-blocking): cargo-deny is the enforcing advisory gate
      # (deny.toml carries the documented ignore list with rationale).
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@2818626c36430864e8e2af44e079e5da87756194 # v2
        with:
          command: check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, test-integration, security]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo build --release --workspace

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: coverage
      - uses: taiki-e/install-action@cargo-tarpaulin
      # Informational only: tarpaulin 0.37+ includes dependency build-script
      # output in its denominator, making a percentage gate meaningless.
      # Re-enable --fail-under after migrating to cargo-llvm-cov (tracked).
      - name: Generate coverage report
        run: cargo tarpaulin --workspace --lib --out Xml --skip-clean || true
      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: coverage.xml
          flags: unittests

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d091125809e98cf2ef0119e2e91ae # v2
        with:
          key: msrv
      - run: cargo check --workspace

  semver:
    name: Semver Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d091125809e98cf2ef0119e2e91ae # v2
        with:
          key: semver
      - uses: taiki-e/install-action@0c5db7f7f897c5d3271fd99a1e5672c59a647e90 # v2
        with:
          tool: cargo-semver-checks
      # Enforcing against the latest tag (v3.0.0+). Breaking API changes
      # require a major-version bump; this gate makes that contract real.
      - name: cargo-semver-checks-lint
        run: |
          BASE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$BASE" ]; then
            echo "Semver baseline: $BASE"
            cargo semver-checks check-release --baseline "$BASE"
          else
            echo "::error::No tags found; refusing to run without a semver baseline"
            exit 1
          fi

  fuzz:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: fuzz
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Run fuzz targets (smoke test)
        run: |
          if [ -d crates/crawlkit-engine/fuzz ]; then
            cd crates/crawlkit-engine
            for target in $(cargo fuzz list 2>/dev/null); do
              echo "Running fuzz target: $target"
              cargo fuzz run "$target" -- -max_total_time=30 || exit 1
            done
          else
            echo "No fuzz directory found (expected at crates/crawlkit-engine/fuzz), skipping fuzz tests"
          fi
