version: 2
updates:
  # Rust workspace (root Cargo.toml + crates/*)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      rust-production:
        dependency-type: production
      rust-development:
        dependency-type: development
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore(deps)"

  # Web dashboard
  - package-ecosystem: npm
    directory: "/dashboard"
    schedule:
      interval: weekly
    groups:
      dashboard-production:
        dependency-type: production
      dashboard-development:
        dependency-type: development
    labels:
      - dependencies
      - dashboard
    commit-message:
      prefix: "chore(deps)"

  # Node.js client SDK
  - package-ecosystem: npm
    directory: "/clients/nodejs"
    schedule:
      interval: weekly
    groups:
      nodejs-client-production:
        dependency-type: production
      nodejs-client-development:
        dependency-type: development
    labels:
      - dependencies
      - nodejs
    commit-message:
      prefix: "chore(deps)"

  # Python client SDK
  - package-ecosystem: pip
    directory: "/clients/python"
    schedule:
      interval: weekly
    groups:
      python-client:
        dependency-type: production
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(deps)"
