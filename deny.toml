# cargo-deny configuration for crawlkit
# Enforces supply chain security: license compliance, vulnerability auditing, advisory database

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
    # fxhash (transitive via wasmtime): unmaintained upstream; tracked for a
    # wasmtime release that swaps to rustc-hash.
    { id = "RUSTSEC-2025-0057" },
    # number_prefix (transitive via indicatif): unmaintained; cosmetic
    # progress-bar dep, no security surface.
    { id = "RUSTSEC-2025-0119" },
    # paste (transitive via sqlx-macros): unmaintained; build-time only,
    # never linked into release binaries.
    { id = "RUSTSEC-2024-0436" },
    # wasmtime 47.0.2: store type-index mixing (low severity, CVSS 3.1 L/H/H).
    # Cannot upgrade to 47.0.3+ without raising MSRV from 1.85 to 1.94;
    # cranelift 0.134.4 (wasmtime dep) requires rustc 1.94.
    { id = "RUSTSEC-2026-0222" },
    # wasmtime 47.0.2: preemption during bulk ops (very low severity, CVSS 4.0).
    # Blocked by same MSRV constraint as above.
    { id = "RUSTSEC-2026-0223" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
highlight = "all"
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
