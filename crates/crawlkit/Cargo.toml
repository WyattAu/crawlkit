[package]
name = "crawlkit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
homepage.workspace = true

[lints]
workspace = true

[[bin]]
name = "crawlkit"
path = "src/main.rs"

[[test]]
name = "cli_tests"
required-features = ["full"]

[[example]]
name = "basic-crawl"
path = "examples/basic-crawl.rs"
required-features = ["full"]

[[example]]
name = "crawl_and_analyze"
path = "examples/crawl_and_analyze.rs"
required-features = ["full"]

[[example]]
name = "custom-analyzer"
path = "examples/custom-analyzer.rs"
required-features = ["full"]

[[example]]
name = "custom_analyzer"
path = "examples/custom_analyzer.rs"
required-features = ["full"]

[[example]]
name = "deterministic_crawl"
path = "examples/deterministic_crawl.rs"
required-features = ["full"]

[[example]]
name = "encrypted_crawl"
path = "examples/encrypted_crawl.rs"
required-features = ["full"]

[[example]]
name = "export-report"
path = "examples/export-report.rs"
required-features = ["full"]

[[example]]
name = "metrics_export"
path = "examples/metrics_export.rs"
required-features = ["full"]

[dependencies]
crawlkit-engine = { path = "../crawlkit-engine", default-features = false }
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
indicatif.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
chrono.workspace = true
uuid = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["trace"], optional = true }
opentelemetry-stdout = { version = "0.32", features = ["trace"], optional = true }
sentry = { version = "0.49", default-features = false, features = ["backtrace", "panic", "rustls"], optional = true }
ed25519-dalek = { version = "2", optional = true }
rand = { version = "0.8", optional = true }
sha2 = { workspace = true, optional = true }
dirs = { version = "5", optional = true }
envstack = { workspace = true, optional = true }
dhat = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[features]
default = ["full"]
full = [
    "crawlkit-engine/full",
    "uuid",
    "async-trait",
    "tracing-opentelemetry",
    "opentelemetry",
    "opentelemetry_sdk",
    "opentelemetry-stdout",
    "sentry",
    "ed25519-dalek",
    "rand",
    "sha2",
    "dirs",
    "envstack",
]
profiling = ["crawlkit-engine/profiling", "dhat"]
