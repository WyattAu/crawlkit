version: 2
updates:
  # Rust workspace (root Cargo.toml + crates/*)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      rust-production:
        dependency-type: production
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      rust-development:
        dependency-type: development
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore(deps)"

  # Web dashboard
  # NOTE: major-version updates are excluded from groups so they arrive as
  # individual PRs. A previous grouped PR bundled 14 packages across 6
  # major versions (vite 6->8, tailwind 3->4, eslint 9->10, TS 5->7, ...) and
  # was unreviewable and unbuildable as one commit.
  - package-ecosystem: npm
    directory: "/dashboard"
    schedule:
      interval: weekly
    groups:
      dashboard-production:
        dependency-type: production
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      dashboard-development:
        dependency-type: development
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    labels:
      - dependencies
      - dashboard
    commit-message:
      prefix: "chore(deps)"

  # Node.js client SDK
  - package-ecosystem: npm
    directory: "/clients/nodejs"
    schedule:
      interval: weekly
    groups:
      nodejs-client-production:
        dependency-type: production
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      nodejs-client-development:
        dependency-type: development
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    labels:
      - dependencies
      - nodejs
    commit-message:
      prefix: "chore(deps)"

  # Python client SDK
  - package-ecosystem: pip
    directory: "/clients/python"
    schedule:
      interval: weekly
    groups:
      python-client:
        dependency-type: production
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(deps)"
