[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "deny"           # Core crates deny unsafe; narrowly scoped FFI crates document exceptions

[workspace.lints.clippy]
# Lints enforced at workspace level
unwrap_used = "deny"           # Zero unwrap() in production code
expect_used = "deny"           # Zero expect() in production code (use descriptive errors)
panic = "deny"                 # Zero panic!() in library code; use error propagation
exit = "deny"                  # Never call process::exit in library code
modulo_arithmetic = "warn"
redundant_clone = "warn"
unused_async = "warn"
if_not_else = "warn"
cognitive_complexity = "allow" # Soft metric — enforce via code review, not CI
too_many_arguments = "warn"


[workspace.package]
version = "4.4.1"
edition = "2021"
rust-version = "1.94.0"
authors = ["Wyatt Au"]
license = "Apache-2.0"
description = "Rust web crawler and SEO analysis toolkit with extensible analyzers and a WASM plugin system"
repository = "https://github.com/WyattAu/crawlkit"
homepage = "https://github.com/WyattAu/crawlkit"
documentation = "https://docs.rs/crawlkit-engine"
readme = "README.md"
keywords = ["seo", "crawler", "web-crawler", "analysis", "rust"]
categories = ["command-line-utilities", "web-programming", "wasm"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
dashmap = "6"
parking_lot = "0.12"
wasmtime = "47"
scraper = "0.22"
ego-tree = "0.10"
csv = "1"
lru = "0.18"
sha2 = "0.10"
redis = { version = "0.25", features = ["tokio-comp"] }
criterion = { version = "0.5", features = ["html_reports"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "migrate", "chrono"] }
dhat = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[workspace.metadata.fuzz]
targets = ["fuzz_parser"]
